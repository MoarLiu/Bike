name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:contracts
      - run: npm run build
      - run: npm run mcp:smoke
      - run: git show --format= --check HEAD && git diff --check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:runtime
        if: runner.os == 'Linux'
      - run: npm run test:2.0.1-runtime
        if: runner.os == 'Linux'
      - run: npm run test:attachments-runtime
        if: runner.os == 'macOS'
      - run: npm run test:2.0-runtime
        if: runner.os == 'macOS'
      - run: npm run test:ui-runtime
        if: runner.os == 'macOS'

  node-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run mcp:smoke
