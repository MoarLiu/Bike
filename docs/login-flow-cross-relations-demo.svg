<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Bike tree with cross relations demo</title>
  <desc id="desc">A login system outline where solid lines show hierarchy and dashed curved lines show cross-node flow relations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f73"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .hint { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .laneTitle { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .nodeText { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .rootText { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f6f73; }
      .root { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .group { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.6; rx: 8; }
      .item { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 7; }
      .warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.4; rx: 7; }
      .ok { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.4; rx: 7; }
      .treeLine { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
      .flowLine { fill: none; stroke: #2f6f73; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .legendBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .legendText { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860"/>
  <text class="title" x="56" y="58">账号登录系统：树状大纲 + 子节点交叉关系</text>
  <text class="hint" x="56" y="88">实线是 Bike 原本的父子层级；虚线箭头是额外的流程关系，不改变节点在树里的位置。</text>

  <rect class="legendBox" x="1020" y="34" width="300" height="76"/>
  <path class="treeLine" d="M1044 58 L1112 58"/>
  <text class="legendText" x="1124" y="63">父子层级</text>
  <path class="flowLine" d="M1044 88 C1066 76 1090 100 1112 88"/>
  <text class="legendText" x="1124" y="93">交叉流程关系</text>

  <!-- Root -->
  <rect class="root" x="590" y="132" width="220" height="46"/>
  <text class="rootText" x="700" y="161" text-anchor="middle">账号登录系统</text>

  <!-- Group nodes -->
  <rect class="group" x="60" y="250" width="200" height="44"/>
  <text class="laneTitle" x="160" y="278" text-anchor="middle">登录入口</text>
  <rect class="group" x="330" y="250" width="200" height="44"/>
  <text class="laneTitle" x="430" y="278" text-anchor="middle">账号校验</text>
  <rect class="group" x="600" y="250" width="200" height="44"/>
  <text class="laneTitle" x="700" y="278" text-anchor="middle">密码校验</text>
  <rect class="group" x="870" y="250" width="200" height="44"/>
  <text class="laneTitle" x="970" y="278" text-anchor="middle">安全策略</text>
  <rect class="group" x="1140" y="250" width="200" height="44"/>
  <text class="laneTitle" x="1240" y="278" text-anchor="middle">登录结果</text>

  <!-- Tree lines root to groups -->
  <path class="treeLine" d="M700 178 L700 214 L160 214 L160 250"/>
  <path class="treeLine" d="M700 178 L700 214 L430 214 L430 250"/>
  <path class="treeLine" d="M700 178 L700 250"/>
  <path class="treeLine" d="M700 178 L700 214 L970 214 L970 250"/>
  <path class="treeLine" d="M700 178 L700 214 L1240 214 L1240 250"/>

  <!-- Login entry items -->
  <rect class="item" x="70" y="340" width="180" height="40"/>
  <text class="nodeText" x="160" y="365" text-anchor="middle">打开登录页</text>
  <rect class="item" x="70" y="410" width="180" height="40"/>
  <text class="nodeText" x="160" y="435" text-anchor="middle">输入账号密码</text>
  <rect class="item" x="70" y="480" width="180" height="40"/>
  <text class="nodeText" x="160" y="505" text-anchor="middle">点击登录</text>
  <path class="treeLine" d="M160 294 L160 340"/>
  <path class="treeLine" d="M160 294 L160 410"/>
  <path class="treeLine" d="M160 294 L160 480"/>

  <!-- Account validation items -->
  <rect class="warn" x="340" y="340" width="180" height="40"/>
  <text class="nodeText" x="430" y="365" text-anchor="middle">账号不存在</text>
  <rect class="warn" x="340" y="410" width="180" height="40"/>
  <text class="nodeText" x="430" y="435" text-anchor="middle">账号已禁用</text>
  <rect class="item" x="340" y="480" width="180" height="40"/>
  <text class="nodeText" x="430" y="505" text-anchor="middle">账号正常</text>
  <path class="treeLine" d="M430 294 L430 340"/>
  <path class="treeLine" d="M430 294 L430 410"/>
  <path class="treeLine" d="M430 294 L430 480"/>

  <!-- Password validation items -->
  <rect class="warn" x="610" y="375" width="180" height="40"/>
  <text class="nodeText" x="700" y="400" text-anchor="middle">密码错误</text>
  <rect class="ok" x="610" y="480" width="180" height="40"/>
  <text class="nodeText" x="700" y="505" text-anchor="middle">密码正确</text>
  <path class="treeLine" d="M700 294 L700 375"/>
  <path class="treeLine" d="M700 294 L700 480"/>

  <!-- Security items -->
  <rect class="warn" x="880" y="340" width="180" height="40"/>
  <text class="nodeText" x="970" y="365" text-anchor="middle">错误次数 +1</text>
  <rect class="warn" x="880" y="410" width="180" height="40"/>
  <text class="nodeText" x="970" y="435" text-anchor="middle">达到阈值</text>
  <rect class="warn" x="880" y="480" width="180" height="40"/>
  <text class="nodeText" x="970" y="505" text-anchor="middle">锁定账号</text>
  <rect class="item" x="880" y="550" width="180" height="40"/>
  <text class="nodeText" x="970" y="575" text-anchor="middle">二次验证</text>
  <path class="treeLine" d="M970 294 L970 340"/>
  <path class="treeLine" d="M970 294 L970 410"/>
  <path class="treeLine" d="M970 294 L970 480"/>
  <path class="treeLine" d="M970 294 L970 550"/>

  <!-- Result items -->
  <rect class="ok" x="1150" y="340" width="180" height="40"/>
  <text class="nodeText" x="1240" y="365" text-anchor="middle">登录成功</text>
  <rect class="warn" x="1150" y="410" width="180" height="40"/>
  <text class="nodeText" x="1240" y="435" text-anchor="middle">提示错误</text>
  <rect class="warn" x="1150" y="480" width="180" height="40"/>
  <text class="nodeText" x="1240" y="505" text-anchor="middle">提示账号锁定</text>
  <rect class="ok" x="1150" y="550" width="180" height="40"/>
  <text class="nodeText" x="1240" y="575" text-anchor="middle">进入首页</text>
  <path class="treeLine" d="M1240 294 L1240 340"/>
  <path class="treeLine" d="M1240 294 L1240 410"/>
  <path class="treeLine" d="M1240 294 L1240 480"/>
  <path class="treeLine" d="M1240 294 L1240 550"/>

  <!-- Cross relation lines -->
  <path class="flowLine" d="M250 500 C286 500 304 500 340 500"/>
  <text class="label" x="295" y="490" text-anchor="middle">提交</text>

  <path class="flowLine" d="M520 500 C554 500 576 393 610 393"/>
  <text class="label" x="566" y="432" text-anchor="middle">继续校验</text>

  <path class="flowLine" d="M520 502 C554 520 576 502 610 502"/>
  <text class="label" x="566" y="528" text-anchor="middle">继续校验</text>

  <path class="flowLine" d="M790 395 C824 390 846 360 880 360"/>
  <text class="label" x="836" y="370" text-anchor="middle">失败记录</text>

  <path class="flowLine" d="M1060 360 C1094 360 1116 430 1150 430"/>
  <text class="label" x="1107" y="390" text-anchor="middle">未超阈值</text>

  <path class="flowLine" d="M1060 500 C1094 500 1116 500 1150 500"/>
  <text class="label" x="1105" y="490" text-anchor="middle">展示锁定</text>

  <path class="flowLine" d="M790 500 C824 520 846 570 880 570"/>
  <text class="label" x="835" y="548" text-anchor="middle">触发风控</text>

  <path class="flowLine" d="M1060 570 C1094 570 1116 360 1150 360"/>
  <text class="label" x="1107" y="456" text-anchor="middle">验证通过</text>

  <path class="flowLine" d="M1330 360 C1370 410 1370 520 1330 570"/>
  <text class="label" x="1365" y="468" text-anchor="middle">创建会话</text>

  <path class="flowLine" d="M520 360 C765 260 1005 288 1150 430"/>
  <text class="label" x="840" y="286" text-anchor="middle">账号不存在</text>

  <path class="flowLine" d="M520 430 C770 320 1000 328 1150 430"/>
  <text class="label" x="840" y="346" text-anchor="middle">账号禁用</text>

  <!-- Bottom annotation -->
  <rect class="legendBox" x="56" y="682" width="1288" height="108"/>
  <text class="hint" x="84" y="718">在 Bike 里，左到右这几列仍然可以是普通大纲节点：登录入口、账号校验、密码校验、安全策略、登录结果。</text>
  <text class="hint" x="84" y="750">虚线关系单独保存，例如「密码错误 → 错误次数 +1」「二次验证 → 登录成功」。它们让两个子节点产生交叉连接，但不把树改成无限深链。</text>
</svg>
